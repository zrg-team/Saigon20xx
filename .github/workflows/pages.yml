# Publishes the landing page (site/), its images (media/) and the playable web build (play/) to GitHub Pages.
# Runs on every push to main; `npm run deploy` in the source repo is what pushes here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r media _site/media
          if [ -f play/index.html ]; then
            cp -r play _site/play
            echo "Playable build: yes ($(find play -type f | wc -l) files)"
          else
            mkdir -p _site/play
            cp site/coming-soon.html _site/play/index.html
            echo "Playable build: not deployed yet (play/ shows a coming-soon page)"
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages sometimes fails on the first try for reasons on GitHub's side: the artifact uploaded half a second
      # earlier isn't listed yet ("No artifacts named github-pages"), or creating the deployment returns a 500. Both
      # pass a little later, so wait and try again in this same run. Re-running the job instead uploads a second
      # github-pages artifact into the run, and deploy-pages then refuses it ("Multiple artifacts named github-pages").
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
